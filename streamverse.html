<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StreamVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed cinematic hero, then horizontally scrolling poster rows; modal for details, overlay player */
:root{
  --bg:#09090b;--bg2:#141418;--bg3:#202027;--fg:#f5f5f7;--muted:#a3a3ad;--line:#2b2b33;
  --red:#e50914;--red-2:#b8070f;--good:#46d369;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body{min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.pad{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* Logo */
.logo{font-family:var(--display);font-weight:800;letter-spacing:.02em;color:var(--red);font-size:1.6rem;text-decoration:none;white-space:nowrap;text-transform:uppercase}
.logo span{color:var(--fg)}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:28px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;background:linear-gradient(#000c,#0000);transition:background .3s}
.nav.solid{background:var(--bg)}
.nav-links{display:flex;gap:20px;list-style:none;margin:0;padding:0}
.nav-links a{text-decoration:none;color:#ddd;font-size:.92rem;white-space:nowrap}
.nav-links a:hover{color:#fff}
.nav-links a.on{color:#fff;font-weight:600}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{display:flex;align-items:center;gap:6px;background:#000a;border:1px solid #fff4;border-radius:4px;padding:6px 10px;width:min(260px,40vw)}
.search svg{flex:none;opacity:.8}
.search input{background:none;border:0;outline:0;width:100%;min-width:0}
.region{background:#000a;border:1px solid #fff3;border-radius:4px;padding:6px 6px}
.avatar{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-family:var(--display);border:0;flex:none}
.menu{position:absolute;right:max(var(--gutter),env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));background:#000e;border:1px solid var(--line);border-radius:6px;min-width:220px;padding:6px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:4px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}

/* Hero */
.hero{position:relative;min-height:min(80vh,760px);display:flex;align-items:flex-end;overflow:hidden;background:var(--bg2)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.hero-bg.show{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d 0%,#0008 40%,#0000 70%),linear-gradient(0deg,var(--bg) 0%,#0000 35%)}
.hero-copy{position:relative;z-index:2;max-width:620px;padding-bottom:clamp(60px,12vh,140px);padding-top:120px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:700;color:#ddd}
.eyebrow b{background:var(--red);color:#fff;padding:2px 6px;border-radius:2px;letter-spacing:.06em}
.hero h1{font-family:var(--display);font-size:clamp(2.2rem,5.5vw,4.2rem);line-height:1;margin:14px 0;text-wrap:balance}
.hero p{color:#e4e4e7;font-size:clamp(.95rem,1.4vw,1.1rem);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 22px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.meta .score{color:var(--good);font-weight:700}
.meta .cert{border:1px solid #fff6;padding:0 6px;border-radius:2px;color:#ddd;font-size:.8rem}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:5px;padding:10px 22px;font-weight:700;font-size:1rem;text-decoration:none}
.btn.white{background:#fff;color:#000}
.btn.white:hover{background:#ffffffc8}
.btn.grey{background:#6d6d7299;color:#fff}
.btn.grey:hover{background:#6d6d7266}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:var(--red-2)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid #fff8;background:#2a2a2fcc;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:#fff}
.icon-btn.on{background:#fff;color:#000;border-color:#fff}
.dots{position:absolute;z-index:3;right:max(var(--gutter),env(safe-area-inset-right,0px));bottom:clamp(60px,12vh,140px);display:flex;gap:6px}
.dots button{width:22px;height:4px;border:0;border-radius:2px;background:#fff5;padding:0}
.dots button.on{background:#fff}

/* Rows */
main{min-height:60vh}
.rows{position:relative;z-index:3;margin-top:-60px;display:flex;flex-direction:column;gap:34px;padding-bottom:40px}
.row h2{font-family:var(--display);font-size:clamp(1.05rem,1.6vw,1.35rem);margin:0 0 10px;font-weight:700}
.track-wrap{position:relative;margin:0 calc(-1 * max(var(--gutter),env(safe-area-inset-left,0px))) 0 calc(-1 * max(var(--gutter),env(safe-area-inset-left,0px)))}
.track{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:10px max(var(--gutter),env(safe-area-inset-left,0px));scroll-padding:0 var(--gutter)}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:10px;bottom:10px;width:var(--gutter);min-width:36px;border:0;background:#000a;z-index:5;opacity:0;transition:opacity .2s;font-size:2rem;display:grid;place-items:center}
.arrow.l{left:0}.arrow.r{right:0}
.track-wrap:hover .arrow{opacity:1}
@media (hover:none){.arrow{display:none}}

/* Cards */
.card{position:relative;flex:none;width:clamp(120px,14vw,190px);aspect-ratio:2/3;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--bg3);transition:transform .25s,box-shadow .25s;text-align:left}
.card img{width:100%;height:100%;object-fit:cover}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:4;box-shadow:0 10px 30px #000c}
.card .info{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;background:linear-gradient(#0000,#000e);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;gap:2px}
.card:hover .info,.card:focus-visible .info{opacity:1}
.card .info b{font-size:.85rem;line-height:1.2}
.card .info span{font-size:.75rem;color:var(--muted)}
.card .info .score{color:var(--good);font-weight:700}
.noimg{width:100%;height:100%;display:grid;place-items:center;padding:12px;text-align:center;font-family:var(--display);font-weight:700;background:linear-gradient(160deg,#2a2a33,#121216);color:#ccc}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:.65rem;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:2px;text-transform:uppercase}
.badge.free{background:#17994a}
.btn.green{background:#17994a;color:#fff}
.btn.green:hover{background:#127a3b}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--red)}
.card.wide{aspect-ratio:16/9;width:clamp(220px,24vw,320px)}
.card.wide .info{opacity:1}
.card.top{width:clamp(170px,19vw,250px);aspect-ratio:auto;height:auto;background:none;display:flex;align-items:flex-end;overflow:visible}
.card.top .num{font-family:var(--display);font-weight:800;font-size:clamp(5rem,9vw,8.5rem);line-height:.8;color:var(--bg);-webkit-text-stroke:3px #777;margin-right:-14px;letter-spacing:-.06em}
.card.top .p{width:60%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;z-index:1;background:var(--bg3)}
.card.top .p img{height:100%;object-fit:cover}
.skel{flex:none;width:clamp(120px,14vw,190px);aspect-ratio:2/3;border-radius:6px;background:linear-gradient(100deg,var(--bg2) 30%,var(--bg3) 50%,var(--bg2) 70%);background-size:300% 100%;animation:sh 1.4s infinite}
.skel.wide{aspect-ratio:16/9;width:clamp(220px,24vw,320px)}
@keyframes sh{to{background-position:-150% 0}}

/* Page views */
.page{padding-top:calc(100px + env(safe-area-inset-top,0px));padding-bottom:40px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-bottom:22px}
.page-head h1{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.4rem);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem}
.chip:hover{border-color:#fff6}
.chip.on{background:var(--fg);color:#000;border-color:var(--fg);font-weight:600}
.select{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}
.grid .card{width:100%}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.wide .card{width:100%}
.sentinel{height:40px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.notice{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:22px;max-width:640px}
.notice h3{font-family:var(--display);margin:0 0 6px}

/* Modal */
.modal-back{position:fixed;inset:0;z-index:60;background:#000b;overflow-y:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 12px 40px;display:flex;justify-content:center;align-items:flex-start}
.modal{position:relative;width:min(900px,100%);background:var(--bg2);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #000;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.m-hero{position:relative;aspect-ratio:16/9;max-height:480px;width:100%;background:var(--bg3)}
.m-hero img{width:100%;height:100%;object-fit:cover}
.m-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 2%,#0000 60%)}
.m-hero-copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 clamp(16px,4vw,44px) 22px}
.m-hero-copy h2{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.8rem);line-height:1.05;margin:0 0 14px;text-wrap:balance}
.close{position:absolute;top:14px;right:14px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:#181818;display:grid;place-items:center}
.m-body{padding:8px clamp(16px,4vw,44px) 36px;display:flex;flex-direction:column;gap:28px}
.m-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
@media (max-width:640px){.m-top{grid-template-columns:1fr}}
.m-top p{margin:12px 0 0;color:#e4e4e7}
.kv{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.kv b{color:#888;font-weight:500}
.kv span{color:#ddd}
.m-body h3{font-family:var(--display);font-size:1.25rem;margin:0 0 12px}
.providers{display:flex;flex-direction:column;gap:14px}
.prov-group{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.prov-group > span{width:80px;color:var(--muted);font-size:.85rem}
.prov{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:5px 10px 5px 5px;text-decoration:none;font-size:.85rem}
.prov:hover{background:#2c2c35}
.prov img{width:32px;height:32px;border-radius:6px}
.small{font-size:.78rem;color:var(--muted)}
.cast{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.person{flex:none;width:92px;text-align:center;font-size:.8rem}
.person .ph{width:80px;height:80px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:var(--bg3);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:#777}
.person .ph img{width:100%;height:100%;object-fit:cover}
.person i{display:block;color:var(--muted);font-style:normal}
.ep-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ep-head h3{margin:0}
.eps{display:flex;flex-direction:column}
.ep{display:grid;grid-template-columns:32px 150px minmax(0,1fr);gap:16px;align-items:center;padding:16px 10px;border-bottom:1px solid var(--line);border-radius:4px}
.ep:first-child{background:var(--bg3)}
.ep .n{font-size:1.4rem;color:var(--muted);text-align:center}
.ep .st{aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--bg3);cursor:pointer;position:relative}
.ep .st::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.4rem;background:#0006;opacity:0;transition:opacity .2s;pointer-events:none}
.ep .st:hover::after,.ep .st:focus-visible::after{opacity:1}
.ep .st img{width:100%;height:100%;object-fit:cover}
.ep h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.ep h4 span{color:var(--muted);font-weight:400;white-space:nowrap}
.ep p{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:560px){.ep{grid-template-columns:110px minmax(0,1fr)}.ep .n{display:none}}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.more .card{width:100%}

/* Player */
.player{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.player-bar{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.player-bar b{font-family:var(--display);font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player iframe,.player video{flex:1;width:100%;min-height:0;border:0;background:#000}
.prog{position:absolute;left:10px;right:10px;bottom:6px;height:3px;background:#ffffff40;border-radius:2px;z-index:2}
.prog i{display:block;height:100%;background:var(--red);border-radius:2px}
.card.wide .info{padding-bottom:14px}
.chip.svc{border-color:#17994a88}
.chip.svc.on{background:#17994a;border-color:#17994a;color:#fff}
.server-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.server-bar::-webkit-scrollbar{display:none}
.server-bar .lbl{color:var(--muted);font-size:.8rem;white-space:nowrap;flex:none;margin-right:4px}
.server-bar .chip{padding:5px 12px;font-size:.8rem;white-space:nowrap;flex:none}

/* Gate screens */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:60px;text-align:center;background:radial-gradient(ellipse at top,#3a0508 0%,var(--bg) 60%)}
.gate h1{font-family:var(--display);font-size:clamp(1.8rem,4vw,3rem);margin:0;text-wrap:balance}
.gate p{color:var(--muted);max-width:56ch;margin:0 auto}
.keybox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(560px,100%)}
.keybox input{flex:1 1 260px;min-width:0;background:#000a;border:1px solid #fff4;border-radius:5px;padding:12px 14px}
.steps{text-align:left;background:#0009;border:1px solid var(--line);border-radius:8px;padding:18px 22px 18px 38px;max-width:560px;color:#d4d4d8;font-size:.92rem;margin:0}
.steps li{margin:4px 0}
.err{color:#ff6b6b;min-height:1.2em;margin:0}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);width:120px}
.prof .avatar{width:110px;height:110px;font-size:2.8rem;border-radius:8px;border:3px solid transparent}
.prof:hover{color:#fff}.prof:hover .avatar{border-color:#fff}
.prof.add .avatar{background:none;border:2px dashed #666;color:#999}
.prof .del{font-size:.75rem;color:#ff8080;background:none;border:0}

/* Toast + footer */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:#fff;color:#000;padding:10px 18px;border-radius:6px;font-weight:600;box-shadow:0 8px 30px #000a;max-width:calc(100vw - 32px)}
footer{border-top:1px solid var(--line);padding-block:30px 50px;color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;gap:6px}
footer a{color:#ccc}

@media (max-width:860px){
  .nav{flex-wrap:wrap;gap:10px 16px}
  .nav-links{order:3;width:100%;overflow-x:auto;scrollbar-width:none;gap:16px}
  .nav-links::-webkit-scrollbar{display:none}
  .search{width:auto;flex:1}
  .nav-right{flex:1;justify-content:flex-end}
  .rows{margin-top:-30px}
  .page{padding-top:calc(130px + env(safe-area-inset-top,0px))}
  .hero-copy{padding-top:150px}
}
@media (max-width:480px){.region{display:none}.btn{padding:9px 16px}.dots{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.track{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const yearOf = it => (it.release_date || it.first_air_date || '').slice(0, 4);
const today = () => new Date().toISOString().slice(0, 10);
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2800); }
const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12l5 5 9-10"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9H4v-9zM7 11l4-8c1.5 0 2.5 1 2.5 2.5V9h5.2a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.5 20H7"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 13V4h3v9zM17 13l-4 8c-1.5 0-2.5-1-2.5-2.5V15H5.3a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.5 4H17"/></svg>',
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',

const API = 'https://api.themoviedb.org/3', IMG = 'https://image.tmdb.org/t/p/';
const cache = new Map();
function tmdb(path, params = {}) {
  if (!KEY) return Promise.reject(Object.assign(new Error('no_key'), { code: 'no_key' }));
  const u = new URL(API + path);
  u.searchParams.set('language', 'en-US');
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== '') u.searchParams.set(k, v);
  const headers = { accept: 'application/json' };
  if (KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + KEY; else u.searchParams.set('api_key', KEY);
  const ck = u.toString();
  if (cache.has(ck)) return cache.get(ck);
  const p = fetch(ck, { headers }).then(r => {
    if (!r.ok) throw Object.assign(new Error('http ' + r.status), { code: r.status === 401 ? 'bad_key' : 'http' });
    return r.json();
  });
  cache.set(ck, p); p.catch(() => cache.delete(ck));
  return p;
}

function archive({ collection = 'feature_films', q = '', page = 1, rows = 36 } = {}) {
  let query = `collection:(${collection}) AND mediatype:(movies)`;
  const clean = q.replace(/[^\p{L}\p{N}\s]/gu, ' ').trim();
  if (clean) query += ` AND title:(${clean})`;
  const u = new URL('https://archive.org/advancedsearch.php');
  u.searchParams.set('q', query);
  ['identifier', 'title', 'year', 'description', 'downloads'].forEach(f => u.searchParams.append('fl[]', f));
  u.searchParams.append('sort[]', 'downloads desc');
  u.searchParams.set('rows', rows); u.searchParams.set('page', page); u.searchParams.set('output', 'json');
  const ck = u.toString();
  if (cache.has(ck)) return cache.get(ck);
  const p = fetch(ck).then(r => { if (!r.ok) throw new Error('archive'); return r.json(); })
    .then(j => ({ items: j.response.docs.filter(d => /^[\w.\-]+$/.test(d.identifier)), total: Math.ceil(j.response.numFound / rows) }));
  cache.set(ck, p); p.catch(() => cache.delete(ck));
  return p;
}

/* ---------- cards & rows ---------- */
function makeCard(it, type) {
  type = it.media_type || type;
  if (type === 'person' || !it.id) return null;
  const title = it.title || it.name || 'Untitled';
  const el = document.createElement('button');
  el.className = 'card';
  el.setAttribute('aria-label', title);
  const score = it.vote_average ? `<span class="score">${Math.round(it.vote_average * 10)}% match</span> · ` : '';
  const isNew = (it.release_date || it.first_air_date || '') >= new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  el.innerHTML = (it.poster_path ? `<img loading="lazy" src="${img(it.poster_path)}" alt="">` : `<div class="noimg">${esc(title)}</div>`)
    + (isNew ? '<span class="badge">New</span>' : '')
    + `<div class="info"><b>${esc(title)}</b><span>${score}${esc(yearOf(it))}${type === 'tv' ? ' · Series' : ''}</span></div>`;
  el.onclick = () => openDetails(type, it.id);
  return el;
}
function makeTopCard(it, type, i) {
  type = it.media_type || type;
  const el = document.createElement('button'); el.className = 'card top';
  el.setAttribute('aria-label', `Number ${i + 1}: ${it.title || it.name}`);
  el.innerHTML = `<span class="num">${i + 1}</span><span class="p">${it.poster_path ? `<img loading="lazy" src="${img(it.poster_path)}" alt="">` : `<span class="noimg">${esc(it.title || it.name)}</span>`}</span>`;
  el.onclick = () => openDetails(type, it.id);

}
function makeFreeCard(d) {
  const el = document.createElement('button'); el.className = 'card wide';
  el.setAttribute('aria-label', d.title);
  const pr = progress()[d.identifier];
  const pct = pr && pr.d ? Math.min(100, Math.round(pr.t / pr.d * 100)) : 0;
  const left = pr && pr.d ? Math.max(1, Math.round((pr.d - pr.t) / 60)) + ' min left' : 'Full movie';
  el.innerHTML = `<img loading="lazy" src="https://archive.org/services/img/${esc(d.identifier)}" alt=""><span class="badge free">Plays here</span><div class="info"><b>${esc(d.title)}</b><span>${esc(d.year || '')}${d.year ? ' · ' : ''}${left}</span></div>${pct ? `<span class="prog"><i style="width:${pct}%"></i></span>` : ''}`;

function row(title, loader, opts = {}) {
  const sec = document.createElement('section'); sec.className = 'row pad';
  sec.innerHTML = `<h2>${esc(title)}</h2><div class="track-wrap"><button class="arrow l" aria-label="Scroll left">‹</button><div class="track"></div><button class="arrow r" aria-label="Scroll right">›</button></div>`;
  const track = $('.track', sec);
  track.innerHTML = `<div class="skel ${opts.wide ? 'wide' : ''}"></div>`.repeat(8);
  $('.arrow.l', sec).onclick = () => track.scrollBy({ left: -track.clientWidth * .85 });
  $('.arrow.r', sec).onclick = () => track.scrollBy({ left: track.clientWidth * .85 });
  Promise.resolve().then(loader).then(items => {
    track.innerHTML = '';
    (items || []).forEach((it, i) => { const c = (opts.make || makeCard)(it, opts.type, i); if (c) track.appendChild(c); });
    if (!track.children.length) sec.remove();
  }).catch(e => { handleErr(e); sec.remove(); });

let io = null;
function infiniteGrid(parent, fetchPage, make, wide = false) {
  if (io) io.disconnect();
  const grid = document.createElement('div'); grid.className = 'grid' + (wide ? ' wide' : '');
  const sentinel = document.createElement('div'); sentinel.className = 'sentinel';
  parent.append(grid, sentinel);
  let page = 1, total = 1, busy = false, token = {};
  const myToken = token;
  async function load() {
    if (busy || page > total) return; busy = true;
    try {
      const r = await fetchPage(page);
      if (!grid.isConnected) return;
      total = Math.min(r.total || 1, 500);
      r.items.forEach((it, i) => { const c = make(it, i); if (c) grid.appendChild(c); });
      page++;
      if (!grid.children.length) grid.outerHTML = '<p class="empty">Nothing found. Try another search or filter.</p>';
    } catch (e) { handleErr(e); total = 0; }
    busy = false;
    if (page <= total && sentinel.getBoundingClientRect().top < innerHeight + 600) load();
  }
  io = new IntersectionObserver(en => { if (en[0].isIntersecting) load(); }, { rootMargin: '600px' });
  io.observe(sentinel); load();
}

let heroTimer;
function hero() {
  const h = document.createElement('section'); h.className = 'hero';
  h.innerHTML = `<div class="hero-copy pad"><span class="eyebrow">Loading…</span></div>`;
  res(tmdb('/trending/all/day')).then(list => {
    const picks = list.filter(x => x.backdrop_path && x.media_type !== 'person').slice(0, 6);
    if (!picks.length) return;
    let i = 0;
    h.innerHTML = picks.map((p, k) => `<img class="hero-bg ${k ? '' : 'show'}" src="${img(p.backdrop_path, 'original')}" alt="">`).join('')
      + `<div class="hero-copy pad"></div><div class="dots">${picks.map((_, k) => `<button aria-label="Show title ${k + 1}" class="${k ? '' : 'on'}"></button>`).join('')}</div>`;
    const show = k => {
      i = k; const p = picks[k], type = p.media_type;
      h.querySelectorAll('.hero-bg').forEach((im, n) => im.classList.toggle('show', n === k));
      h.querySelectorAll('.dots button').forEach((b, n) => b.classList.toggle('on', n === k));
      $('.hero-copy', h).innerHTML = `
        <span class="eyebrow"><b>#${k + 1}</b> Trending today · ${type === 'tv' ? 'Series' : 'Film'}</span>
        <h1>${esc(p.title || p.name)}</h1>
        <div class="meta" style="margin-bottom:12px"><span class="score">${Math.round((p.vote_average || 0) * 10)}% match</span><span>${esc(yearOf(p))}</span></div>
        <p>${esc(p.overview)}</p>
        <div class="btns"><button class="btn green" data-a="play">${ICON.play} Play</button><button class="btn white" data-a="trailer">${ICON.play} Trailer</button><button class="btn grey" data-a="info">${ICON.info} More Info</button></div>`;
      $('[data-a=play]', h).onclick = () => { if (type === 'tv') openDetails(type, p.id); else openEmbed('movie', p.id, p.title || p.name); };
      $('[data-a=trailer]', h).onclick = () => playTrailer(type, p.id, p.title || p.name);
      $('[data-a=info]', h).onclick = () => openDetails(type, p.id);
    };
    h.querySelectorAll('.dots button').forEach((b, n) => b.onclick = () => { show(n); restart(); });
    const restart = () => { clearInterval(heroTimer); heroTimer = setInterval(() => { if (!h.isConnected) return clearInterval(heroTimer); if (!$('.modal-back') && !$('.player')) show((i + 1) % picks.length); }, 9000); };
    show(0); restart();
  }).catch(e => { handleErr(e); h.remove(); });
  return h;
}

function pickTrailer(vids = []) {
  const yt = vids.filter(v => v.site === 'YouTube' && /^[\w-]{6,20}$/.test(v.key));

  return v?.key;
}
async function playTrailer(type, id, title) {
  try { const d = await tmdb(`/${type}/${id}/videos`); const k = pickTrailer(d.results); if (!k) return toast('No trailer available for this title yet.'); openPlayer(`https://www.youtube.com/embed/${k}?autoplay=1&rel=0&modestbranding=1&playsinline=1`, title + ' · Trailer'); }
  catch (e) { handleErr(e); }
}

function openFree(doc) {
  const desc = plain(doc.description);
  const modal = openModal(`
    <div class="m-hero"><img src="https://archive.org/services/img/${esc(doc.identifier)}" alt="" style="object-fit:contain;background:#000">
      <div class="m-hero-copy"><h2>${esc(doc.title)}</h2><div class="btns" id="fbtns"><button class="btn white" id="fplay">${ICON.play} Play Movie</button></div></div></div>
    <div class="m-body"><div><div class="meta"><span class="score">Free</span><span>${esc(doc.year || '')}</span><span class="cert">Full movie</span></div>
      <p style="color:#e4e4e7">${esc(desc.length > 900 ? desc.slice(0, 900) + '…' : desc || 'No description available.')}</p>
      <p class="small">Hosted by the Internet Archive. <a href="https://archive.org/details/${esc(doc.identifier)}" target="_blank" rel="noopener">View on archive.org</a></p></div></div>`);
  $('#fbtns', modal).append(listButton({ type: 'free', identifier: doc.identifier, title: doc.title, year: doc.year }));
  const pr = progress()[doc.identifier];
  if (pr && pr.t > 30) $('#fplay', modal).innerHTML = `${ICON.play} Resume from ${fmtTime(pr.t)}`;
  $('#fplay', modal).onclick = () => {
    const h = history().filter(x => x.identifier !== doc.identifier);
    h.unshift({ identifier: doc.identifier, title: doc.title, year: doc.year, description: desc.slice(0, 600) });
    store.set(pkey('hist'), h.slice(0, 20));
    playFree(doc);
  };
}
const fmtTime = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

/* Plays the film's MP4 in our own player (with resume). Falls back to the Internet Archive's embedded player. */
async function playFree(doc) {
  const id = doc.identifier;
  let file = null;
  try {
    const m = await fetch(`https://archive.org/metadata/${id}`).then(r => r.json());
    const mp4 = (m.files || []).filter(f => /\.mp4$/i.test(f.name) && !/sample|trailer/i.test(f.name));
    file = mp4.find(f => /^h\.264$/i.test(f.format)) || mp4.find(f => /h\.264/i.test(f.format) && !/hd/i.test(f.format)) || mp4.find(f => /mpeg4/i.test(f.format)) || mp4[0] || null;
  } catch {}
  if (!file) return openPlayer(`https://archive.org/embed/${id}?autoplay=1`, doc.title);
  const src = `https://archive.org/download/${id}/${file.name.split('/').map(encodeURIComponent).join('/')}`;
  openVideo(src, doc.title, id, () => openPlayer(`https://archive.org/embed/${id}?autoplay=1`, doc.title));
}

function playerShell(title, opts = {}) {
  closePlayer();
  const p = document.createElement('div'); p.className = 'player';
  const sbar = opts.servers && opts.servers.length
    ? `<div class="server-bar"><span class="lbl">Server:</span>${opts.servers.map((s, i) => `<button class="chip svc${i === 0 ? ' on' : ''}" data-s="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>`
    : '';
  p.innerHTML = `<div class="player-bar"><button class="icon-btn" data-a="back" aria-label="Back">${ICON.back}</button><b></b><button class="icon-btn" data-a="fs" aria-label="Fullscreen" title="Fullscreen" style="margin-left:auto">${ICON.fs}</button></div>${sbar}`;
  $('b', p).textContent = title;
  $('[data-a=back]', p).onclick = closePlayer;
  $('[data-a=fs]', p).onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else (p.requestFullscreen ? p.requestFullscreen() : Promise.reject()).catch(() => toast('Fullscreen is not available in this browser. Use the player\'s own fullscreen button.'));
  };
  if (opts.onServer) {
    p.querySelectorAll('.server-bar .chip').forEach(c => c.onclick = () => {
      p.querySelectorAll('.server-bar .chip').forEach(x => x.classList.toggle('on', x === c));
      opts.onServer(c.dataset.s);
    });
  }
  document.body.appendChild(p); document.body.style.overflow = 'hidden';
  return p;
}
/* Replace the current iframe/video inside a player with a new source (used when switching servers) */
function setPlayerSrc(p, src) {
  p.querySelectorAll('iframe, video').forEach(el => el.remove());
  p.insertAdjacentHTML('beforeend', `<iframe src="${esc(src)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>`);
}
/* Open a movie or TV episode using embed streaming servers, with a server selector in the player bar */
function openEmbed(type, id, title, season, episode) {
  const list = SERVERS[type] || SERVERS.movie;
  const buildSrc = s => {
    const srv = list.find(x => x.id === s) || list[0];
    return type === 'tv' ? srv.url(id, season, episode) : srv.url(id);
  };
  const label = title + (type === 'tv' ? ` · S${season} E${episode}` : '');
  const p = playerShell(label, {
    servers: list,
    onServer: sid => { setPlayerSrc(p, buildSrc(sid)); toast('Switched server — if it still won\'t load, try another.'); }
  });
  setPlayerSrc(p, buildSrc(list[0].id));
  toast('If the video doesn\'t load, pick another server in the bar above.');
}
function openPlayer(src, title) {
  const p = playerShell(title);
  p.insertAdjacentHTML('beforeend', `<iframe src="${esc(src)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`);
}
function openVideo(src, title, id, onFail) {
  const p = playerShell(title);
  const v = document.createElement('video');
  v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
  p.appendChild(v);
  const saved = progress()[id];
  v.addEventListener('loadedmetadata', () => {
    if (saved && saved.t > 30 && saved.t < v.duration - 60) { v.currentTime = saved.t; toast('Resuming from ' + fmtTime(saved.t)); }
  }, { once: true });
  let last = 0;
  const save = (force) => {
    if (!v.duration || (!force && Date.now() - last < 5000)) return;
    last = Date.now();
    const all = progress();
    if (v.currentTime > v.duration - 60) delete all[id]; else all[id] = { t: Math.floor(v.currentTime), d: Math.floor(v.duration) };
    store.set(pkey('prog'), all);
  };
  v.addEventListener('timeupdate', () => save(false));
  v.addEventListener('pause', () => save(true));
  v.addEventListener('ended', () => save(true));
  v.addEventListener('error', () => { if (v.isConnected && onFail) onFail(); }, { once: true });
  p._save = () => save(true);
}
function closePlayer() {
  const p = $('.player');
  if (p) { if (p._save) p._save(); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); p.remove(); if ((location.hash.slice(1) || 'home') === 'home' && p._save) route(); }
  if (!$('.modal-back')) document.body.style.overflow = '';
}

/* ---------- routing ---------- */
const VIEWS = { home: viewHome, tv: m => viewBrowse(m, 'tv'), movies: m => viewBrowse(m, 'movie'), new: viewNew, free: viewFree, list: viewList, search: viewSearch };
function route() {
  if (!$('#main')) return;
  const name = location.hash.slice(1) || 'home';
  const v = VIEWS[name] || viewHome;
  if (io) { io.disconnect(); io = null; }
  clearInterval(heroTimer);
  closeModal();
  const main = $('#main'); main.innerHTML = '';
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + name));
  if (name !== 'search') scrollTo(0, 0);
  v(main);
}
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.player')) closePlayer(); else closeModal(); } });

function boot(chosen = false) {
  if (!KEY && !store.get('sv_skipkey', false)) return showSetup();
  if (!chosen) {
    const last = profiles.find(p => p.id === store.get('sv_last', ''));
    if (profiles.length > 1 || !last) { if (profiles.length === 1) { profile = profiles[0]; } else return showProfiles(); }
    else profile = last;
  }
  if (!profile) profile = profiles[0];
  shell(); route();
}
boot();
</script>
